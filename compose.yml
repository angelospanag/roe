services:
  api:
    build: .
    container_name: roe-api
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/roe_backend?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3
    container_name: roe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roe_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
